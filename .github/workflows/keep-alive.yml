name: Cloud Backend 24/7 Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    name: Keep Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          echo "Pinging Cloud Backend at $(date)..."
          curl -s -f -m 15 https://salon-api-tuwo.onrender.com/api/v1/health/ping || echo "Backend waking up..."
