name: Deploy to Mumbai VPS

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 [1/5] Pulling latest production code..."
            cd /var/www/styleslot
            git reset --hard
            git clean -fd
            git pull origin production

            export NODE_OPTIONS="--max-old-space-size=512"

            echo "🔑 [2/5] Updating Production Environment Variables (WhatsApp, SMTP Email, Gemini AI)..."
            cat << 'ENVEOF' > /var/www/styleslot/backend/.env
            PORT=3000
            NODE_ENV=production
            APP_ENV=production
            DATABASE_URL="postgresql://styleslot_user:StyleSlotProd2026Pass@localhost:5432/styleslot_prod?schema=public"
            JWT_SECRET="styleslot-super-secure-production-jwt-key-2026-mumbai-32chars"
            JWT_EXPIRES_IN="60d"
            CORS_ORIGINS="*"
            REDIS_HOST="localhost"
            REDIS_PORT=6379
            WHATSAPP_PHONE_NUMBER_ID="1344691785393273"
            WHATSAPP_ACCESS_TOKEN="EAA7FciyDOmYBS0ZCe07F4daN0JXf0x1Bt1Trkc4QajShyo6A0nVklAbgeY5ZCcpgMZBSZCzc8QJYkCSKwziDDbtSS8kw0caeu915pphPOnwtZAxuyZBeFy1ZAvzwsHjLLZCZBqSbuIv6qswxUz2DoR5EXdLsB7s85MldvufAJfFns00IEne8V36NYZAtxkfFIhOAZDZD"
            WHATSAPP_VERIFY_TOKEN="salon_webhook_verify_token_prod"
            SMTP_HOST="smtp.gmail.com"
            SMTP_PORT=465
            SMTP_SECURE=true
            SMTP_USER="trilokshivhare9@gmail.com"
            SMTP_PASS="wkvgtandbiquexet"
            SMTP_FROM="Styleslot Security <trilokshivhare9@gmail.com>"
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            ENVEOF
            sed -i 's/^[ \t]*//' /var/www/styleslot/backend/.env

            echo "📦 [3/5] Building NestJS Backend & Syncing Database..."
            cd /var/www/styleslot/backend
            npm install --prefer-offline --no-audit --no-fund
            npx prisma db push --accept-data-loss
            npm run build
            pm2 reload styleslot-api || pm2 restart styleslot-api || pm2 start dist/main.js --name "styleslot-api"

            echo "🌐 [4/5] Building Vite Frontend Bundle..."
            cd /var/www/styleslot/apps/web
            npm install --prefer-offline --no-audit --no-fund
            npm run build

            echo "🔒 [5/5] Configuring Nginx Reverse Proxy (HTTP & HTTPS)..."
            cat << 'NGINXEOF' > /etc/nginx/sites-available/default
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _ 129.121.133.105 129.121.133.105.sslip.io;

                client_max_body_size 50M;

                # Allow ACME challenge for Let's Encrypt certificate renewals
                location /.well-known/acme-challenge/ {
                    root /var/www/html;
                }

                # Redirect all web traffic to secure HTTPS domain
                location / {
                    return 301 https://129.121.133.105.sslip.io$request_uri;
                }
            }

            server {
                listen 443 ssl default_server;
                listen [::]:443 ssl default_server;
                server_name _ 129.121.133.105 129.121.133.105.sslip.io;

                ssl_certificate /etc/letsencrypt/live/129.121.133.105.sslip.io/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/129.121.133.105.sslip.io/privkey.pem;

                client_max_body_size 50M;

                # Frontend SPA
                location / {
                    root /var/www/styleslot/apps/web/dist;
                    index index.html;
                    try_files $uri $uri/ /index.html;
                }

                # Backend API Reverse Proxy
                location /api/ {
                    proxy_pass http://127.0.0.1:3000/api/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }

                # Health Check
                location /health {
                    proxy_pass http://127.0.0.1:3000/health;
                    proxy_set_header Host $host;
                }
            }
            NGINXEOF
            sed -i 's/^[ \t]*//' /etc/nginx/sites-available/default

            nginx -t && systemctl reload nginx

            echo "=================================================="
            echo "🎉 DEPLOYMENT COMPLETE! Meta Token & Nginx active."
            echo "=================================================="
