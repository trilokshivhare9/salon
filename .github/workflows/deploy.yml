name: Deploy to Mumbai VPS

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    name: Auto Deploy to Production VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 [1/4] Pulling latest production code..."
            cd /var/www/styleslot
            git reset --hard
            git pull origin production

            echo "📦 [2/4] Building NestJS Backend & Syncing Database..."
            cd /var/www/styleslot/backend
            npm install --production=false
            npx prisma db push --accept-data-loss
            npm run build
            pm2 restart styleslot-api || pm2 start dist/main.js --name "styleslot-api"

            echo "🌐 [3/4] Building Vite Frontend Bundle..."
            cd /var/www/styleslot/apps/web
            npm install
            npm run build

            echo "🔒 [4/5] Setting up Free HTTPS / SSL (Required by Meta WhatsApp Webhooks)..."
            which certbot || (apt update && apt install -y certbot python3-certbot-nginx)
            grep -q "129.121.133.105.sslip.io" /etc/nginx/sites-available/default || sed -i 's/server_name _;/server_name _ 129.121.133.105.sslip.io;/g' /etc/nginx/sites-available/default
            certbot --nginx -d 129.121.133.105.sslip.io --non-interactive --agree-tos -m trilokshivhare9@gmail.com --redirect || true

            echo "🔄 [5/5] Reloading Nginx Web Server..."
            systemctl reload nginx

            echo "=================================================="
            echo "🎉 DEPLOYMENT COMPLETE! VPS is updated and online."
            echo "=================================================="
