<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.15" filter="blur(30px)"/>

  <!-- Bespoke Hairdresser Scissors Glyph -->
  <g transform="translate(116, 116) scale(11.66)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="3" fill="none" stroke="url(#irisGrad)" stroke-width="2"/>
    <circle cx="6" cy="18" r="3" fill="none" stroke="url(#irisGrad)" stroke-width="2"/>
    <line x1="20" y1="4" x2="8.12" y2="15.88" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <line x1="14.47" y1="14.48" x2="20" y2="20" stroke="url(#goldGrad)" stroke-width="2.2"/>
    <line x1="8.12" y1="8.12" x2="12" y2="12" stroke="url(#goldGrad)" stroke-width="2.2"/>
  </g>
</svg>
