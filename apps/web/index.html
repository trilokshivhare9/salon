<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>StyleSlot — Luxury Multi-Tenant Salon Operations & WhatsApp Platform</title>
  <meta name="description" content="State-of-the-art salon management platform with real-time chair queue, stylist capacity monitor, client CRM, and WhatsApp automation.">
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D0B0F">
  <meta name="background-color" content="#0D0B0F">

  <!-- Apple iOS & Modern Mobile PWA Capabilities -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StyleSlot">
  <link rel="apple-touch-icon" href="/icon.svg">

  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
</head>
<body>
  <!-- Main Application Root (Dynamically mounts dedicated portals) -->
  <div id="app-root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0c0f17; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; gap: 16px;">
      <div style="width: 44px; height: 44px; border: 3px solid rgba(168, 85, 247, 0.2); border-top-color: #a855f7; border-radius: 50%; animation: initial-spin 0.8s linear infinite;"></div>
      <div style="font-size: 0.95rem; font-weight: 700; color: #e2e8f0; letter-spacing: -0.01em;">StyleSlot Operations</div>
      <div style="font-size: 0.78rem; color: #94a3b8;">Loading workspace...</div>
    </div>
    <style>@keyframes initial-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
  </div>

  <!-- Meta Facebook JavaScript SDK for WhatsApp Embedded Signup -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
