<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SalonFlow — Luxury Multi-Tenant Salon Operations & WhatsApp Platform</title>
  <meta name="description" content="State-of-the-art salon management platform with real-time chair queue, stylist capacity monitor, client CRM, and WhatsApp automation.">
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#07090e">
  <meta name="background-color" content="#07090e">

  <!-- Apple iOS & Modern Mobile PWA Capabilities -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SalonFlow">
  <link rel="apple-touch-icon" href="/icon.svg">

  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
</head>
<body>
  <!-- Main Application Root (Dynamically mounts dedicated portals) -->
  <div id="app-root"></div>

  <!-- Meta Facebook JavaScript SDK for WhatsApp Embedded Signup -->
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
