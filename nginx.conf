server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ 129.121.133.105 129.121.133.105.sslip.io;

    client_max_body_size 50M;

    # Allow ACME challenge for Let's Encrypt certificate renewals
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all web traffic to secure HTTPS domain
    location / {
        return 301 https://129.121.133.105.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _ 129.121.133.105 129.121.133.105.sslip.io;

    ssl_certificate /etc/letsencrypt/live/129.121.133.105.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/129.121.133.105.sslip.io/privkey.pem;

    client_max_body_size 50M;

    # Frontend SPA
    location / {
        root /var/www/styleslot/apps/web/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health Check
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
    }
}
